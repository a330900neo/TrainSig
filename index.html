<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrainSig</title>
<link rel="icon" type="image/png" href="/icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0f0f11;
    --panel: #17171a;
    --line: #2e2e33;
    --text: #e4e4e7;
    --muted: #71717a;
    --accent: #3b82f6;
    --accent-dark: #2563eb;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    overflow: hidden;
  }

  body{
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage{
    position: relative;
    width: 100%;
    max-width: 720px;
    padding: 40px 32px;
  }

  .kicker{
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 6px 0;
    letter-spacing: 0.02em;
  }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 42px);
    line-height: 1.1;
    margin: 0 0 8px 0;
    max-width: 11ch;
  }

  .subtitle{
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 40px 0;
  }

  .route{
    position: relative;
    width: 100%;
    height: 230px;
  }

  .route svg{
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .route-path{
    fill: none;
    stroke: var(--line);
    stroke-width: 6;
    stroke-linecap: round;
  }

  .route-path-fill{
    fill: none;
    stroke: var(--accent);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 620;
    stroke-dashoffset: 620;
    animation: draw 1.4s ease-out forwards 0.15s;
  }

  @keyframes draw{
    to{ stroke-dashoffset: 0; }
  }

  .stop{
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    color: inherit;
    display: block;
  }

  .stop-dot{
    fill: var(--bg);
    stroke: var(--accent);
    stroke-width: 5;
    transition: stroke 0.15s, fill 0.15s, r 0.15s;
  }

  .stop:hover .stop-dot,
  .stop:focus-visible .stop-dot{
    fill: var(--accent);
    r: 12;
  }

  .stop-label{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 20px;
    fill: var(--text);
  }

  .stop-sub{
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    fill: var(--muted);
  }

  .stop:hover .stop-label,
  .stop:focus-visible .stop-label{
    fill: var(--accent);
  }

  .stop:focus-visible .stop-dot{
    outline: none;
    filter: drop-shadow(0 0 0 3px var(--accent-dark));
  }

  .footnote{
    margin-top: 34px;
    font-size: 12px;
    color: var(--muted);
    max-width: 42ch;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="stage">
    <p class="kicker">Line 1 &middot; Terminus to Terminus</p>
    <h1>TrainSig</h1>
    <p class="subtitle">A transit line diagram creator &amp; signalling sim</p>

    <div class="route">
      <svg viewBox="0 0 620 230" preserveAspectRatio="xMinYMid meet">
        <path class="route-path" d="M 40 200 C 160 200, 160 40, 310 40 C 460 40, 460 200, 580 200" />
        <path class="route-path-fill" d="M 40 200 C 160 200, 160 40, 310 40 C 460 40, 460 200, 580 200" />

        <a class="stop" tabindex="-1" href="#play" id="link-play">
          <circle class="stop-dot" cx="40" cy="200" r="9" />
          <text class="stop-label" x="40" y="228" text-anchor="middle">Play</text>
          <text class="stop-sub" x="40" y="176" text-anchor="middle">run the network</text>
        </a>

        <a class="stop" tabindex="-1" href="/builder" id="link-build">
          <circle class="stop-dot" cx="580" cy="200" r="9" />
          <text class="stop-label" x="580" y="228" text-anchor="middle">Build</text>
          <text class="stop-sub" x="580" y="176" text-anchor="middle">open editor</text>
        </a>
      </svg>
    </div>

    <p class="footnote">
      Build draws the network. Play imports what you've built and runs it
      live &mdash; work the signals, and control the clock with pause and
      1x&ndash;60x time warp.
    </p>
  </div>

  <script>
    function goToBuilder(){
      window.location.href = '/TrainSig/builder';
    }
    function goToPlay(){
      window.location.href = '/TrainSig/game';
    }
    document.getElementById('link-play').addEventListener('click', function(e){
      e.preventDefault();
      goToPlay();
    });
    document.getElementById('link-build').addEventListener('click', function(e){
      e.preventDefault();
      goToBuilder();
    });
  </script>

</body>
</html>
